<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Juegos</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background: url('fondo.jpg') no-repeat center center fixed;
    background-size: cover;
    color:white;
    margin:0;
    padding:20px;
  }
  h1 { text-align:center; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:15px; max-width:900px; margin:20px auto; }
  .card { background:#2a2a3d; border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:0.2s; }
  .card:hover { background:#3a3a55; }
  .card img { width:100%; height: 160px; object-fit: cover; border-radius:6px; }

  #player-container {
    display:none;
    max-width:900px;
    margin:20px auto;
    text-align:center;
  }
  #ruffle-target {
    width:100%;
    max-width:854px;
    height: 70vh; /* Se adapta a la altura disponible en móviles */
    max-height: 550px;
    margin:0 auto;
    background:black;
    border-radius: 8px;
    overflow: hidden;
  }
  #ruffle-target:fullscreen,
  #ruffle-target:-webkit-full-screen {
    max-width:none;
    max-height:none;
    width:100vw;
    height:100vh;
  }
  #ruffle-target iframe,
  #ruffle-target > * {
    width:100%!important;
    height:100%!important;
    display:block;
    border:none;
  }
  .controls-bar {
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:10px;
  }
  #close-btn, #fullscreen-btn {
    padding:8px 16px;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
  }
  #close-btn { background:#e94560; }
  #fullscreen-btn { background:#3a7bd5; }
</style>
</head>
<body>

<h1>Mis Juegos</h1>

<div class="grid">
  <div class="card" onclick="abrirJuego('games/baby-hazel-ballon.swf', 'swf')">
    <img src="portadas/baby1.PNG" alt="Baby Hazel Balloon">
    <p>Baby Hazel Balloon</p>
  </div>
  <div class="card" onclick="abrirJuego('games/barbie-manicure-secrets.swf', 'swf')">
    <img src="portadas/manicure1.PNG" alt="Manicure barbie secret">
    <p>Manicure barbie secret</p>
  </div>
  <!-- Cut the Rope -->
  <div class="card" onclick="abrirJuego('https://play.famobi.com/cut-the-rope', 'iframe')">
    <img src="https://cdn.blipzi.com/cu/tt/cut-the-rope-d.jpg" alt="Cut the Rope">
    <p>Cut the Rope</p>
  </div>
  <!-- Om Nom Run -->
  <div class="card" onclick="abrirJuego('https://play.famobi.com/om-nom-run', 'iframe')">
    <img src="https://cdn.now.gg/apps-content/com.nowgg.h5.pub513.app51248/game-tiles/om-nom-run.jpg" alt="Om Nom Run">
    <p>Om Nom Run</p>
  </div>
  <!-- SNES Game -->
  <div class="card" onclick="abrirEmuladorSNES()">
    <img src="https://www.nintendo.com/eu/media/images/10_share_images/games_15/virtual_console_wii_u_7/H2x1_WiiUVC_KirbysDreamLand3_image1600w.jpg" alt="Kirby SNES">
    <p>Kirby SNES</p>
  </div>
  <!-- Bubble Rush 2 -->
  <div class="card" onclick="abrirJuego('https://html5.gamemonetize.co/yp7vtch9c6vott101pztfdfm0p19c5c5/', 'iframe')">
    <img src="https://img.gamemonetize.com/yp7vtch9c6vott101pztfdfm0p19c5c5/512x340.jpg" alt="Bubble Shooter">
    <p>Bubble Shooter</p>
  </div>
  <!-- Vortella's Dress Up -->
  <div class="card" onclick="abrirEnNuevaPestana('https://g.igroutka.ru/games/1051/46EGTi3A0JVKvazt/8a2438a5-3b9a-44ed-994d-e97ce026c7f0/index.html')">
    <img src="https://gogamego.io/wp-content/uploads/thumbs/custom/V/Vortellas-Dress-Up.webp" alt="vortella dres up">
    <p>Vortella Dress Up</p>
  </div>
   <!-- Minecraft Pc -->
  <div class="card" onclick="abrirJuego('https://nite.games/embed/minecraft', 'iframe')">
    <img src="https://images.icon-icons.com/3053/PNG/512/minecraft_alt_macos_bigsur_icon_189942.png" alt="Minecraft Creative">
    <p>Minecraft PC </p>
  </div>
  <!-- Mineblock HTML5 -->
  <div class="card" onclick="abrirJuego('//funhtml5games.com?embed=mineblock', 'iframe')">
    <img src="https://cdn.icon-icons.com/icons2/1381/PNG/512/minecraft_94415.png" alt="Mineblock">
    <p>Mineblock (táctil)</p>
  </div>
  <!-- Mine – Online -->
  <div class="card" onclick="abrirEnNuevaPestana('https://playhop.com/dist-app/448223?header=no&skip-guard=1&utm_source=parent_window_api&utm_medium=playgama&clid=2951034&flags={%22adv_types_disabled%22:16}', 'iframe')">
    <img src="portadas/mine online.jpg" alt="Mine Online">
    <p>Mine – Online</p>
  </div>
  <div class="card" onclick="abrirJuego('https://app-548551.games.s3.yandex.net/548551/cyjcbp7a5cqajglkxfjbahm080mq8yht_brotli/index.html?sdk=%2Fsdk%2F_%2Fv2.5871b227ff69bc337568.js#origin=https%3A%2F%2Fplayhop.com&app-id=548551&device-type=desktop', 'iframe')">
  <img src="https://i.pinimg.com/736x/13/9e/20/139e20f273489bb2e2da53a2c70b51f7.jpg" alt="Mine Online">
  <p>Minecraft Survial And Creative</p>
</div>
</div>

<div id="player-container">
  <div id="ruffle-target"></div>
  <div class="controls-bar">
    <button id="fullscreen-btn" onclick="pantallaCompleta()">⛶ Pantalla completa</button>
    <button id="close-btn" onclick="cerrarJuego()">Cerrar juego</button>
  </div>
</div>

<script>
  let currentPlayer = null;

  function abrirJuego(ruta, tipo) {
    const target = document.getElementById('ruffle-target');
    target.innerHTML = '';

    if (tipo === 'swf') {
      const ruffle = window.RufflePlayer.newest();
      currentPlayer = ruffle.createPlayer();
      currentPlayer.style.width = "100%";
      currentPlayer.style.height = "100%";
      target.appendChild(currentPlayer);
      currentPlayer.load(ruta);
    } else if (tipo === 'iframe') {
      const iframe = document.createElement('iframe');
      iframe.src = ruta;
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";
      iframe.allowFullscreen = true;
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.allow = "fullscreen; autoplay; gamepad; pointer-lock";

      target.appendChild(iframe);
    }   
    document.getElementById('player-container').style.display = 'block';
    window.scrollTo({ top: document.getElementById('player-container').offsetTop, behavior: 'smooth' });
  }

  function abrirEmuladorSNES() {
    const target = document.getElementById('ruffle-target');
    target.innerHTML = '';

    const iframe = document.createElement('iframe');
    iframe.src = "https://www.retrogames.cc/embed/23267-kirby-s-dream-land-3-usa.html";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.allowFullscreen = true;
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('webkitallowfullscreen', 'true');
    iframe.setAttribute('mozallowfullscreen', 'true');
    iframe.allow = "autoplay; gamepad; fullscreen; accelerometer; gyroscope";
    target.appendChild(iframe);

    document.getElementById('player-container').style.display = 'block';
    window.scrollTo({ top: document.getElementById('player-container').offsetTop, behavior: 'smooth' });
  }

  function abrirEnNuevaPestana(url) {
    window.open(url, '_blank');
  }

  function pantallaCompleta() {
    const target = document.getElementById('ruffle-target');
    if (target.requestFullscreen) {
      target.requestFullscreen();
    } else if (target.webkitRequestFullscreen) {
      target.webkitRequestFullscreen();
    } else if (target.msRequestFullscreen) {
      target.msRequestFullscreen();
    }
  }

  function cerrarJuego() {
    document.getElementById('ruffle-target').innerHTML = '';
    document.getElementById('player-container').style.display = 'none';
  }
</script>

</body>
</html>
