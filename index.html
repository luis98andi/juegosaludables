<style>
  body {
    font-family: Arial, sans-serif;
    background: url('fondo.jpg') no-repeat center center fixed;
    background-size: cover;
    color:white;
    margin:0;
    padding:20px;
  }
  h1 { text-align:center; }
.logo { width: 100%; max-width: 260px; height: 110px; object-fit: cover; clip-path: inset(0 3px 0 0); }
h1 { margin: 10px 0; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:15px; max-width:900px; margin:20px auto; }
.card { background:none; border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:0.2s; }
.card:hover { transform:scale(1.05); }
.card img { width:100%; height:160px; object-fit:cover; border-radius:16px; }
.card { position: relative; }
.card p { position: absolute; left: 10px; right: 10px; bottom: 10px; margin: 0; padding: 26px 8px 8px; box-sizing: border-box; border-radius: 0 0 16px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: white; font-size: 14px; font-weight: bold; }
.card p { opacity: 0; transition: 0.2s; }
.card:hover p { opacity: 1; }
  #player-container {
    display:none;
    max-width:900px;
    margin:20px auto;
    text-align:center;
  }
  #ruffle-target {
    width:100%;
    max-width:854px;
    height: 70vh; /* Se adapta a la altura disponible en móviles */
    max-height: 550px;
    margin:0 auto;
    background:black;
    border-radius: 8px;
    overflow: hidden;
  }
  #ruffle-target:fullscreen,
  #ruffle-target:-webkit-full-screen {
    max-width:none;
    max-height:none;
    width:100vw;
    height:100vh;
  }
  #ruffle-target iframe,
  #ruffle-target > * {
    width:100%!important;
    height:100%!important;
    display:block;
    border:none;
  }
  .controls-bar {
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:10px;
  }
  #close-btn, #fullscreen-btn {
    padding:8px 16px;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
  }
  #close-btn { background:#e94560; }
  #fullscreen-btn { background:#3a7bd5; }
</style>
</head>

<div id="player-container">
  <div id="ruffle-target"></div>
  <div class="controls-bar">
    <button id="fullscreen-btn" onclick="pantallaCompleta()">⛶ Pantalla completa</button>
    <button id="close-btn" onclick="cerrarJuego()">Cerrar juego</button>
  </div>
</div>

<script>
  let currentPlayer = null;

  function abrirJuego(ruta, tipo) {
    const target = document.getElementById('ruffle-target');
    target.innerHTML = '';

    if (tipo === 'swf') {
      const ruffle = window.RufflePlayer.newest();
      currentPlayer = ruffle.createPlayer();
      currentPlayer.style.width = "100%";
      currentPlayer.style.height = "100%";
      target.appendChild(currentPlayer);
      currentPlayer.load(ruta);
    } else if (tipo === 'iframe') {
      const iframe = document.createElement('iframe');
      iframe.src = ruta;
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";
      iframe.allowFullscreen = true;
      iframe.setAttribute('allowfullscreen', 'true');
      iframe.allow = "fullscreen; autoplay; gamepad; pointer-lock";

      target.appendChild(iframe);
    }   
    document.getElementById('player-container').style.display = 'block';
    window.scrollTo({ top: document.getElementById('player-container').offsetTop, behavior: 'smooth' });
  }

  function abrirEmuladorSNES() {
    const target = document.getElementById('ruffle-target');
    target.innerHTML = '';

    const iframe = document.createElement('iframe');
    iframe.src = "https://www.retrogames.cc/embed/23267-kirby-s-dream-land-3-usa.html";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.allowFullscreen = true;
    iframe.setAttribute('allowfullscreen', 'true');
    iframe.setAttribute('webkitallowfullscreen', 'true');
    iframe.setAttribute('mozallowfullscreen', 'true');
    iframe.allow = "autoplay; gamepad; fullscreen; accelerometer; gyroscope";
    target.appendChild(iframe);

    document.getElementById('player-container').style.display = 'block';
    window.scrollTo({ top: document.getElementById('player-container').offsetTop, behavior: 'smooth' });
  }

  function abrirEnNuevaPestana(url) {
    window.open(url, '_blank');
  }
async function pantallaCompleta() {
  const target = document.getElementById('ruffle-target');
  
  if (target.requestFullscreen) {
    await target.requestFullscreen();
  } else if (target.webkitRequestFullscreen) {
    await target.webkitRequestFullscreen();
  } else if (target.msRequestFullscreen) {
    await target.msRequestFullscreen();
  }

  try {
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch (e) {
    console.log('Orientación no soportada o bloqueada:', e);
  }
   }
  function cerrarJuego() {
    document.getElementById('ruffle-target').innerHTML = '';
    document.getElementById('player-container').style.display = 'none';
  }
</script>
