<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Juegos</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
  body {
  font-family: Arial, sans-serif;
  background: url('fondo.jpg') no-repeat center center fixed;
  background-size: cover;
  color:white;
  margin:0;
  padding:20px;
}
  h1 { text-align:center; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:15px; max-width:900px; margin:20px auto; }
  .card { background:#2a2a3d; border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:0.2s; }
  .card:hover { background:#3a3a55; }
  .card img { width:100%; height: 160px; object-fit: cover; border-radius:6px; }

  #player-container {
    display:none;
    max-width:900px;
    margin:20px auto;
    text-align:center;
  }
  #ruffle-target {
    width:100%;
    max-width:800px;
    height:600px;
    margin:0 auto;
    background:black;
  }
  #close-btn {
    margin-top:10px;
    padding:8px 16px;
    background:#e94560;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
  }
</style>
</head>
<body>

<h1>Mis Juegos</h1>

<div class="grid">
  <div class="card" onclick="abrirJuego('games/baby-hazel-ballon.swf', 'swf')">
    <img src="portadas/baby1.PNG" alt="Baby Hazel Balloon">
    <p>Baby Hazel Balloon</p>
  </div>
  <div class="card" onclick="abrirJuego('games/barbie-manicure-secrets.swf', 'swf')">
    <img src="portadas/manicure1.PNG" alt="Manicure barbie secret">
    <p>Manicure barbie secret</p>
  </div>
  <!-- Cut the Rope -->
  <div class="card" onclick="abrirJuego('https://play.famobi.com/cut-the-rope', 'iframe')">
    <img src="https://cdn.blipzi.com/cu/tt/cut-the-rope-d.jpg" alt="Cut the Rope">
    <p>Cut the Rope</p>
  </div>
  <!-- Om Nom Run -->
  <div class="card" onclick="abrirJuego('https://play.famobi.com/om-nom-run', 'iframe')">
    <img src="https://cdn.now.gg/apps-content/com.nowgg.h5.pub513.app51248/game-tiles/om-nom-run.jpg" alt="Om Nom Run">
    <p>Om Nom Run</p>
  </div>
  <!-- SNES Game -->
  <div class="card" onclick="abrirEmuladorSNES()">
    <img src="https://www.bing.com/images/search?view=detailV2&ccid=VdO6OpnH&id=D0C6D182D3630F7283EAD20CC14284463CD55753&thid=OIP.VdO6OpnH0rQAaVaoBNjfWQHaHa&mediaurl=https%3A%2F%2Fbsnes.org%2Fwp-content%2Fuploads%2F2023%2F03%2FKirbys-Dream-Land-3-768x768.jpg&cdnurl=https%3A%2F%2Fth.bing.com%2Fth%2Fid%2FR.55d3ba3a99c7d2b4006956a804d8df59%3Frik%3DU1fVPEaEQsEM0g%26pid%3DImgRaw%26r%3D0&exph=768&expw=768&q=kirby+icono+snes+drame+ladn+3&ck=97CE1F641C1A7D40794604C9FD0D08F2&selectedIndex=3&itb=0&ajaxhist=0&ajaxserp=0&shtc=0&shth=OIP.VdO6OpnH0rQAaVaoBNjfWQHaHa&shsc=idp&form=EX0050&shid=4a120163-1c51-4706-8b44-a783949bf2d3&shtp=GetUrl&shtk=S2lyYnkncyBEcmVhbSBMYW5kIDMgUm9tIChEb3dubG9hZCBmb3IgU05FUyk%3D&shdk=RW5jb250cmFkbyBlbiBCaW5nIGRlc2RlIGJzbmVzLm9yZw%3D%3D&shhk=RgQvSNZPKMtYUep2ufUO1vvyZjvq8NgbLq2l%2BGeyAv8%3D" alt="Kirby SNES">
    <p>Kirby SNES</p>
  </div>
</div>

<div id="player-container">
  <div id="ruffle-target"></div>
  <br>
  <button id="close-btn" onclick="cerrarJuego()">Cerrar juego</button>
</div>

<script>
  let currentPlayer = null;

  function abrirJuego(ruta, tipo) {
    const target = document.getElementById('ruffle-target');
    target.innerHTML = '';

    if (tipo === 'swf') {
      const ruffle = window.RufflePlayer.newest();
      currentPlayer = ruffle.createPlayer();
      currentPlayer.style.width = "100%";
      currentPlayer.style.height = "100%";
      target.appendChild(currentPlayer);
      currentPlayer.load(ruta);
    } else if (tipo === 'iframe') {
      const iframe = document.createElement('iframe');
      iframe.src = ruta;
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";
      iframe.allowFullscreen = true;
      target.appendChild(iframe);
    }

    document.getElementById('player-container').style.display = 'block';
    window.scrollTo({ top: document.getElementById('player-container').offsetTop, behavior: 'smooth' });
  }

  function abrirEmuladorSNES() {
    const target = document.getElementById('ruffle-target');
    target.innerHTML = '';

    const iframe = document.createElement('iframe');
    // Enlace directo corregido al embed de Kirby SNES limpio
    iframe.src = "https://www.retrogames.cc/embed/23267-kirby-s-dream-land-3-usa.html";
    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "none";
    iframe.allowFullscreen = true;
    iframe.allow = "autoplay; gamepad; fullscreen";
    target.appendChild(iframe);

    document.getElementById('player-container').style.display = 'block';
    window.scrollTo({ top: document.getElementById('player-container').offsetTop, behavior: 'smooth' });
  }

  function cerrarJuego() {
    document.getElementById('ruffle-target').innerHTML = '';
    document.getElementById('player-container').style.display = 'none';
  }
</script>

</body>
</html>
