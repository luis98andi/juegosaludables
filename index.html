  body {
  font-family: Arial, sans-serif;

  background-size: cover;
  color:white;
  margin:0;
  padding:20px;
}
  h1 { text-align:center; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:15px; max-width:900px; margin:20px auto; }
  .card { background:#2a2a3d; border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:0.2s; }
  .card:hover { background:#3a3a55; }
  .card img { width:100%; height: 160px; object-fit: cover; border-radius:6px; }

  #player-container {
    display:none;
    max-width:900px;
    margin:20px auto;
    text-align:center;
  }
  #ruffle-target {
    width:100%;
    max-width:800px;
    height:600px;
    margin:0 auto;
    background:black;
  }
  #close-btn {
    margin-top:10px;
    padding:8px 16px;
    background:#e94560;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
  }
</style>
</head>
