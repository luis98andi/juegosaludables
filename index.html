<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMind Games</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
body{font-family:Arial,sans-serif;background:url('fondo.jpg') no-repeat center center fixed;background-size:cover;color:white;margin:0;padding:20px}
h1{text-align:center}
.logo{width:100%;max-width:260px;height:110px;object-fit:cover;clip-path:inset(0 3px 0 0)}
h1{margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:900px;margin:20px auto}
.card{background:none;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.card:hover{transform:scale(1.05)}
.card img{width:100%;height:160px;object-fit:cover;border-radius:16px}
.card p{position:absolute;left:10px;right:10px;bottom:10px;margin:0;padding:26px 8px 8px;box-sizing:border-box;border-radius:0 0 16px 16px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:white;font-size:14px;font-weight:bold;opacity:0;transition:.2s}
.card:hover p{opacity:1}
#player-container{display:none;max-width:900px;margin:20px auto;text-align:center}
#ruffle-target{width:100%;max-width:854px;height:70vh;max-height:550px;margin:0 auto;background:black;border-radius:8px;overflow:hidden}
#ruffle-target:fullscreen,#ruffle-target:-webkit-full-screen{max-width:none;max-height:none;width:100vw;height:100vh}
#ruffle-target iframe,#ruffle-target>*{width:100%!important;height:100%!important;display:block;border:none}
.controls-bar{margin-top:10px;display:flex;justify-content:center;gap:10px}
#close-btn,#fullscreen-btn{padding:8px 16px;border:none;color:white;border-radius:6px;cursor:pointer}
#close-btn{background:#e94560}#fullscreen-btn{background:#3a7bd5}

#admin-launcher{position:fixed;right:14px;bottom:14px;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.35);z-index:1000}
#admin-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:999;padding:18px;overflow:auto}
.admin-box{max-width:900px;margin:20px auto;background:#171717;border-radius:14px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.admin-box h2{margin-top:0}.admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.admin-actions button,.admin-box button{padding:9px 12px;border:0;border-radius:7px;cursor:pointer}
.admin-list{display:grid;gap:8px}.admin-row{background:#242424;padding:10px;border-radius:9px;display:flex;align-items:center;gap:10px}
.admin-row img{width:50px;height:50px;object-fit:cover;border-radius:7px}.admin-row .grow{flex:1}
.admin-muted{opacity:.75;font-size:13px}
#pin-screen{text-align:center}.pin-input{font-size:22px;text-align:center;letter-spacing:6px;padding:10px;width:130px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px}.form-grid input,.form-grid select{padding:9px;border-radius:6px;border:1px solid #555;background:#292929;color:#fff}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}.preview{background:#252525;padding:8px;border-radius:8px}.preview img{width:100%;height:110px;object-fit:cover;border-radius:6px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.admin-row{align-items:flex-start}.admin-row img{width:42px;height:42px}}
</style>
</head>
<body>

<h1><img src="portadas/logo.png" alt="FreshMind Games" class="logo"></h1>
<div id="grid" class="grid"></div>

<div id="player-container">
  <div id="ruffle-target"></div>
  <div class="controls-bar">
    <button id="fullscreen-btn" onclick="pantallaCompleta()">⛶ Pantalla completa</button>
    <button id="close-btn" onclick="cerrarJuego()">Cerrar juego</button>
  </div>
</div>

<button id="admin-launcher" title="Administrar FreshMind Games" onclick="abrirAdmin()">⚙️</button>

<div id="admin-panel">
  <div class="admin-box">
    <div id="pin-screen">
      <h2>🔐 Administración</h2>
      <p>Introduce el PIN para entrar.</p>
      <input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
      <br><br><button onclick="validarPin()">Entrar</button>
      <button onclick="cerrarAdmin()">Cerrar</button>
      <p id="pin-error" style="color:#ff8b8b"></p>
    </div>

    <div id="admin-content" style="display:none">
      <h2>⚙️ Administrar FreshMind Games</h2>
      <p class="admin-muted">Esta primera versión lee el catálogo desde <b>juegos.json</b>. Los cambios se pueden exportar como un nuevo JSON.</p>

      <div class="admin-actions">
        <button onclick="mostrarAgregar()">➕ Agregar juego</button>
        <button onclick="mostrarMultiples()">⚙️ Agregar hasta 20</button>
        <button onclick="exportarJSON()">💾 Exportar catálogo</button>
        <button onclick="importarJSON()">📥 Importar catálogo</button>
        <button onclick="document.getElementById('jsonFile').click()">📂 Abrir JSON</button>
        <button onclick="cerrarAdmin()">Cerrar</button>
        <input id="jsonFile" type="file" accept=".json,application/json" style="display:none" onchange="leerJSON(event)">
      </div>

      <div id="editor"></div>
      <div id="admin-list" class="admin-list"></div>
    </div>
  </div>
</div>

<script>
let catalogo={version:1,categorias:[],juegos:[]};
let currentPlayer=null;
const PIN="1234";

async function cargarCatalogo(){
  try{
    const r=await fetch('juegos.json',{cache:'no-store'});
    if(!r.ok) throw new Error('No se pudo cargar juegos.json');
    catalogo=await r.json();
    if(!Array.isArray(catalogo.juegos)) catalogo.juegos=[];
    renderJuegos();
  }catch(e){
    console.error(e);
    document.getElementById('grid').innerHTML='<p style="text-align:center">No se pudo cargar el catálogo de juegos.</p>';
  }
}

function renderJuegos(){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  [...catalogo.juegos].sort((a,b)=>(a.orden||0)-(b.orden||0)).forEach(j=>{
    const card=document.createElement('div');
    card.className='card';
    card.onclick=()=>abrirJuego(j.url,j.tipo,j.accion);
    const img=document.createElement('img');
    img.src=j.imagen; img.alt=j.nombre;
    const p=document.createElement('p'); p.textContent=j.nombre;
    card.append(img,p); grid.appendChild(card);
  });
}

function abrirJuego(ruta,tipo,accion){
  if(accion==='abrirEmuladorSNES' || tipo==='snes') return abrirEmuladorSNES(ruta);
  if(accion==='abrirEnNuevaPestana' || tipo==='newtab'){ window.open(ruta,'_blank'); return; }
  const target=document.getElementById('ruffle-target'); target.innerHTML='';
  if(tipo==='swf'){
    const ruffle=window.RufflePlayer.newest();
    currentPlayer=ruffle.createPlayer();
    currentPlayer.style.width='100%'; currentPlayer.style.height='100%';
    target.appendChild(currentPlayer); currentPlayer.load(ruta);
  }else{
    const iframe=document.createElement('iframe');
    iframe.src=ruta; iframe.style.width='100%'; iframe.style.height='100%'; iframe.style.border='none';
    iframe.allowFullscreen=true; iframe.setAttribute('allowfullscreen','true');
    iframe.allow='fullscreen; autoplay; gamepad; pointer-lock';
    target.appendChild(iframe);
  }
  document.getElementById('player-container').style.display='block';
  window.scrollTo({top:document.getElementById('player-container').offsetTop,behavior:'smooth'});
}

function abrirEmuladorSNES(url){
  const target=document.getElementById('ruffle-target'); target.innerHTML='';
  const iframe=document.createElement('iframe'); iframe.src=url;
  iframe.style.width='100%'; iframe.style.height='100%'; iframe.style.border='none';
  iframe.allowFullscreen=true; iframe.setAttribute('allowfullscreen','true');
  iframe.setAttribute('webkitallowfullscreen','true'); iframe.setAttribute('mozallowfullscreen','true');
  iframe.allow='autoplay; gamepad; fullscreen; accelerometer; gyroscope';
  target.appendChild(iframe);
  document.getElementById('player-container').style.display='block';
  window.scrollTo({top:document.getElementById('player-container').offsetTop,behavior:'smooth'});
}
async function pantallaCompleta(){
  const target=document.getElementById('ruffle-target');
  if(target.requestFullscreen) await target.requestFullscreen();
  else if(target.webkitRequestFullscreen) await target.webkitRequestFullscreen();
  else if(target.msRequestFullscreen) await target.msRequestFullscreen();
  try{if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');}
  catch(e){console.log('Orientación no soportada o bloqueada:',e);}
}
function cerrarJuego(){document.getElementById('ruffle-target').innerHTML='';document.getElementById('player-container').style.display='none';}

function abrirAdmin(){document.getElementById('admin-panel').style.display='block';document.getElementById('pin').focus();}
function cerrarAdmin(){document.getElementById('admin-panel').style.display='none';document.getElementById('pin-screen').style.display='block';document.getElementById('admin-content').style.display='none';document.getElementById('pin').value='';}
function validarPin(){
  if(document.getElementById('pin').value===PIN){
    document.getElementById('pin-screen').style.display='none';
    document.getElementById('admin-content').style.display='block';
    renderAdmin();
  }else document.getElementById('pin-error').textContent='PIN incorrecto.';
}
function renderAdmin(){
  const list=document.getElementById('admin-list'); list.innerHTML='';
  [...catalogo.juegos].sort((a,b)=>(a.orden||0)-(b.orden||0)).forEach((j,i)=>{
    const row=document.createElement('div'); row.className='admin-row';
    row.innerHTML=`<img src="${escapeAttr(j.imagen)}" alt=""><div class="grow"><b>${escapeHtml(j.nombre)}</b><div class="admin-muted">${escapeHtml(j.tipo||'iframe')} ${j.categoria?'· '+escapeHtml(j.categoria):''}</div></div>
    <button onclick="editarJuego('${j.id}')">✏️</button><button onclick="subirJuego('${j.id}')">⬆️</button><button onclick="bajarJuego('${j.id}')">⬇️</button><button onclick="eliminarJuego('${j.id}')">🗑️</button>`;
    list.appendChild(row);
  });
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function escapeAttr(s){return escapeHtml(s).replace(/`/g,'&#96;');}

function mostrarAgregar(){
  const e=document.getElementById('editor');
  e.innerHTML=`<div style="background:#222;padding:14px;border-radius:10px;margin-bottom:15px">
  <h3>➕ Nuevo juego</h3>
  <div class="form-grid">
  <label>Nombre<input id="fNombre" placeholder="Ej. Kirby Dream Land 3"></label>
  <label>Tipo<select id="fTipo"><option value="iframe">Juego online / iframe</option><option value="swf">Flash SWF</option><option value="snes">SNES / emulador</option><option value="newtab">Abrir en otra pestaña</option></select></label>
  <label>URL del juego<input id="fUrl" placeholder="https://..."></label>
  <label>URL de imagen<input id="fImagen" placeholder="https://...jpg / png / webp"></label>
  </div><br>
  <button onclick="guardarNuevo()">💾 Añadir al catálogo</button> <button onclick="cancelarEditor()">Cancelar</button></div>`;
}
function cancelarEditor(){document.getElementById('editor').innerHTML='';}
function guardarNuevo(){
  const nombre=document.getElementById('fNombre').value.trim(),url=document.getElementById('fUrl').value.trim(),imagen=document.getElementById('fImagen').value.trim(),tipo=document.getElementById('fTipo').value;
  if(!nombre||!url||!imagen){alert('Completa nombre, URL del juego e imagen.');return;}
  catalogo.juegos.push({id:'game-'+Date.now(),nombre,imagen,url,tipo,accion:tipo==='snes'?'abrirEmuladorSNES':tipo==='newtab'?'abrirEnNuevaPestana':'abrirJuego',categoria:'',orden:catalogo.juegos.length+1});
  renderJuegos();renderAdmin();cancelarEditor();
}

function mostrarMultiples(){
  const e=document.getElementById('editor');
  let rows='';
  for(let i=1;i<=20;i++) rows+=`<div style="background:#292929;padding:10px;border-radius:8px;margin:7px 0"><b>${i}</b><div class="form-grid">
  <label>Nombre<input data-multi="nombre" data-i="${i}" placeholder="Opcional"></label>
  <label>Tipo<select data-multi="tipo" data-i="${i}"><option value="iframe">iframe</option><option value="swf">SWF</option><option value="snes">SNES</option><option value="newtab">Nueva pestaña</option></select></label>
  <label>URL del juego<input data-multi="url" data-i="${i}" placeholder="https://..."></label>
  <label>Imagen<input data-multi="imagen" data-i="${i}" placeholder="URL de portada"></label>
  </div></div>`;
  e.innerHTML=`<div style="background:#222;padding:14px;border-radius:10px;margin-bottom:15px"><h3>⚙️ Agregar hasta 20 juegos</h3><p class="admin-muted">Solo se añadirán las filas que tengan al menos nombre y URL.</p>${rows}<button onclick="guardarMultiples()">💾 Añadir los juegos completados</button> <button onclick="cancelarEditor()">Cancelar</button></div>`;
}
function valMulti(kind,i){return document.querySelector(`[data-multi="${kind}"][data-i="${i}"]`)?.value.trim()||'';}
function guardarMultiples(){
  let added=0;
  for(let i=1;i<=20;i++){
    const nombre=valMulti('nombre',i),url=valMulti('url',i),imagen=valMulti('imagen',i),tipo=valMulti('tipo',i);
    if(!nombre&&!url&&!imagen) continue;
    if(!nombre||!url||!imagen) continue;
    catalogo.juegos.push({id:'game-'+Date.now()+'-'+i,nombre,imagen,url,tipo,accion:tipo==='snes'?'abrirEmuladorSNES':tipo==='newtab'?'abrirEnNuevaPestana':'abrirJuego',categoria:'',orden:catalogo.juegos.length+1}); added++;
  }
  renderJuegos();renderAdmin();cancelarEditor();
  alert(added+' juego(s) añadidos. Exporta el catálogo para guardar el archivo JSON.');
}

function editarJuego(id){
  const j=catalogo.juegos.find(x=>x.id===id); if(!j)return;
  const e=document.getElementById('editor');
  e.innerHTML=`<div style="background:#222;padding:14px;border-radius:10px;margin-bottom:15px"><h3>✏️ Editar juego</h3><div class="form-grid">
  <label>Nombre<input id="eNombre" value="${escapeAttr(j.nombre)}"></label>
  <label>Tipo<select id="eTipo"><option value="iframe">iframe</option><option value="swf">SWF</option><option value="snes">SNES</option><option value="newtab">Nueva pestaña</option></select></label>
  <label>URL<input id="eUrl" value="${escapeAttr(j.url)}"></label>
  <label>Imagen<input id="eImagen" value="${escapeAttr(j.imagen)}"></label>
  <label>Categoría<input id="eCat" value="${escapeAttr(j.categoria||'')}" placeholder="Opcional"></label>
  </div><br><button onclick="guardarEdicion('${id}')">💾 Guardar</button> <button onclick="cancelarEditor()">Cancelar</button></div>`;
  document.getElementById('eTipo').value=j.tipo||'iframe';
}
function guardarEdicion(id){
  const j=catalogo.juegos.find(x=>x.id===id); if(!j)return;
  j.nombre=document.getElementById('eNombre').value.trim();j.tipo=document.getElementById('eTipo').value;j.url=document.getElementById('eUrl').value.trim();j.imagen=document.getElementById('eImagen').value.trim();j.categoria=document.getElementById('eCat').value.trim();
  j.accion=j.tipo==='snes'?'abrirEmuladorSNES':j.tipo==='newtab'?'abrirEnNuevaPestana':'abrirJuego';
  renderJuegos();renderAdmin();cancelarEditor();
}
function eliminarJuego(id){if(!confirm('¿Eliminar este juego del catálogo actual?'))return;catalogo.juegos=catalogo.juegos.filter(x=>x.id!==id);reordenar();renderJuegos();renderAdmin();}
function reordenar(){catalogo.juegos.forEach((j,i)=>j.orden=i+1);}
function subirJuego(id){const a=catalogo.juegos.sort((x,y)=>(x.orden||0)-(y.orden||0)),i=a.findIndex(x=>x.id===id);if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];reordenar();renderJuegos();renderAdmin();}}
function bajarJuego(id){const a=catalogo.juegos.sort((x,y)=>(x.orden||0)-(y.orden||0)),i=a.findIndex(x=>x.id===id);if(i>=0&&i<a.length-1){[a[i],a[i+1]]=[a[i+1],a[i]];reordenar();renderJuegos();renderAdmin();}}

function exportarJSON(){
  reordenar();
  const blob=new Blob([JSON.stringify(catalogo,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='juegos.json';a.click();URL.revokeObjectURL(a.href);
}
function importarJSON(){document.getElementById('jsonFile').click();}
function leerJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data.juegos))throw new Error();catalogo=data;renderJuegos();renderAdmin();alert('Catálogo cargado correctamente.');}catch(e){alert('JSON no válido.');}};
  r.readAsText(f);ev.target.value='';
}

cargarCatalogo();
</script>
</body>
</html>
