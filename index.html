<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Juegos</title>
<style>
  body { font-family: Arial, sans-serif; background:#1e1e2f; color:white; margin:0; padding:20px; }
  h1 { text-align:center; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:15px; max-width:900px; margin:20px auto; }
  .card { background:#2c2c44; border-radius:10px; overflow:hidden; text-decoration:none; color:white; text-align:center; transition: transform .2s; }
  .card:hover { transform: scale(1.05); }
  .card img { width:100%; height:120px; object-fit:cover; }
  .card p { margin:8px 0; font-weight:bold; }
</style>
</head>
<body>

<h1>🎮 Mis Juegos</h1>

<div class="grid" id="juegos"></div>

<script>
  // Para agregar un juego nuevo, solo copia una línea de estas
  // y cambia carpeta, título e imagen. Nada más.
  const juegos = [
    { carpeta: "juego1", titulo: "Nombre del juego 1", imagen: "juego1/miniatura.png" },
    // { carpeta: "juego2", titulo: "Nombre del juego 2", imagen: "juego2/miniatura.png" },
  ];

  const contenedor = document.getElementById("juegos");
  juegos.forEach(j => {
    contenedor.innerHTML += `
      <a class="card" href="${j.carpeta}/index.html">
        <img src="${j.imagen}" alt="${j.titulo}">
        <p>${j.titulo}</p>
      </a>`;
  });
</script>

</body>
</html>
