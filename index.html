<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Juegos</title>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<style>
  body { font-family: Arial, sans-serif; background:#1e1e2f; color:white; margin:0; padding:20px; }
  h1 { text-align:center; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap:15px; max-width:900px; margin:20px auto; }
  .card { background:#2a2a3d; border-radius:10px; padding:10px; text-align:center; cursor:pointer; transition:0.2s; }
  .card:hover { background:#3a3a55; }
  .card img { width:100%; border-radius:6px; }

  #player-container {
    display:none;
    max-width:900px;
    margin:20px auto;
    text-align:center;
  }
  #player-container embed {
    width:100%;
    max-width:800px;
    height:600px;
    background:black;
  }
  #close-btn {
    margin-top:10px;
    padding:8px 16px;
    background:#e94560;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
  }
</style>
</head>
<body>

<h1>Mis Juegos</h1>

<div class="grid">
  <div class="card" onclick="abrirJuego('games/baby-hazel-ballon.swf')">
    <img src="https://via.placeholder.com/160x100?text=Juego" alt="Baby Hazel Balloon">
    <p>Baby Hazel Balloon</p>
  </div>
</div>

<div id="player-container">
  <embed id="game-embed" src="" width="800" height="600">
  <br>
  <button id="close-btn" onclick="cerrarJuego()">Cerrar juego</button>
</div>

<script>
  function abrirJuego(ruta) {
    document.getElementById('game-embed').src = ruta;
    document.getElementById('player-container').style.display = 'block';
    window.scrollTo({ top: document.getElementById('player-container').offsetTop, behavior: 'smooth' });
  }
  function cerrarJuego() {
    document.getElementById('game-embed').src = '';
    document.getElementById('player-container').style.display = 'none';
  }
</script>

</body>
</html>
